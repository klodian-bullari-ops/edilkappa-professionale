name: Pubblica EdilKappa in produzione

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: Scrivi PUBBLICA per confermare il deploy di produzione
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: edilkappa-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.conferma == 'PUBBLICA'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            mcp-server/package-lock.json
      - name: Installa e testa funzioni
        working-directory: functions
        run: npm ci && npm test && npm run check
      - name: Installa e testa connettore
        working-directory: mcp-server
        run: npm ci && npm test && npm run check
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EDILKAPPA }}
      - name: Pubblica Hosting, regole e funzioni di sicurezza
        run: npx --yes firebase-tools deploy --project edilkappa-professionale --only hosting,firestore:rules,storage,functions:edilkappaBackup,functions:backupEdilkappaNightly,functions:edilkappaDaneaBridge --non-interactive
