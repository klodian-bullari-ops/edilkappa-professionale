name: Pubblica EdilKappa in produzione

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: Scrivi PUBBLICA per confermare il deploy di produzione
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: edilkappa-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.conferma == 'PUBBLICA'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            mcp-server/package-lock.json
            quality-tests/package-lock.json
      - name: Installa Java per gli emulatori Firebase
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Ripristina cache browser ed emulatori qualità
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: quality-${{ runner.os }}-${{ hashFiles('quality-tests/package-lock.json') }}
      - name: Testa regole Firebase e interfaccia mobile/desktop
        working-directory: quality-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - name: Installa e testa funzioni
        working-directory: functions
        run: npm ci && npm test && npm run check && npm audit --omit=dev --audit-level=moderate
      - name: Installa e testa connettore
        working-directory: mcp-server
        run: npm ci && npm test && npm run check && npm run build && npm audit --omit=dev --audit-level=moderate
      - name: Autentica GitHub su Google Cloud senza chiavi permanenti
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: edilkappa-professionale
          workload_identity_provider: projects/583702130706/locations/global/workloadIdentityPools/github-actions/providers/edilkappa-main
          service_account: github-deploy@edilkappa-professionale.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Configura Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"
      - name: Verifica identità e progetto di produzione
        run: |
          set -euo pipefail
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test "$active_account" = "github-deploy@edilkappa-professionale.iam.gserviceaccount.com"
          gcloud config set project edilkappa-professionale --quiet
          test "$(gcloud config get-value project)" = "edilkappa-professionale"
      - name: Prepara protezione App Check graduale
        env:
          APP_CHECK_MODE: ${{ vars.FIREBASE_APP_CHECK_MODE }}
          APP_CHECK_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_SITE_KEY }}
        run: |
          set -euo pipefail
          mode="${APP_CHECK_MODE:-observe}"
          if [ "$mode" != "observe" ] && [ "$mode" != "enforce" ]; then
            echo "FIREBASE_APP_CHECK_MODE deve essere observe oppure enforce."
            exit 1
          fi
          if [ "$mode" = "enforce" ] && [ -z "${APP_CHECK_SITE_KEY:-}" ]; then
            echo "App Check non può essere imposto senza FIREBASE_APP_CHECK_SITE_KEY."
            exit 1
          fi
          printf 'EDILKAPPA_APP_CHECK_MODE=%s\n' "$mode" > functions/.env.edilkappa-professionale
      - name: Pubblica le funzioni callable
        run: |
          set -euo pipefail
          for function_name in edilkappaBackup edilkappaDaneaBridge edilkappaHealth edilkappaNotifications edilkappaPublicLead edilkappaOperations edilkappaAi; do
            deploy_log="$(mktemp)"
            set +e
            npx --yes firebase-tools deploy \
              --project edilkappa-professionale \
              --only "functions:${function_name}" \
              --non-interactive 2>&1 | tee "$deploy_log"
            deploy_status="${PIPESTATUS[0]}"
            set -e
            if [ "$deploy_status" -ne 0 ] && ! grep -Eq "Unable to set the invoker|Failed to set the IAM Policy" "$deploy_log"; then
              exit "$deploy_status"
            fi
          done
      - name: Mantieni raggiungibili le funzioni callable
        run: |
          set -euo pipefail
          for service in edilkappabackup edilkappadaneabridge edilkappahealth edilkappanotifications edilkappapubliclead edilkappaoperations edilkappaai; do
            gcloud run services update "$service" \
              --project=edilkappa-professionale \
              --region=europe-west8 \
              --no-invoker-iam-check \
              --quiet
          done
      - name: Pubblica Hosting, regole e funzioni interne
        env:
          EDILKAPPA_APP_CHECK_SITE_KEY: ${{ vars.FIREBASE_APP_CHECK_SITE_KEY }}
          EDILKAPPA_APP_CHECK_MODE: ${{ vars.FIREBASE_APP_CHECK_MODE }}
        run: npx --yes firebase-tools deploy --project edilkappa-professionale --only hosting,firestore:rules,firestore:indexes,storage,functions:backupEdilkappaNightly,functions:monitorEdilkappaHealth,functions:processDaneaInbox --non-interactive
